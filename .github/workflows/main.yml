name: Messenger Bot CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Auto Repair package.json
      run: |
        # Node.js স্ক্রিপ্ট দিয়ে package.json ফাইলের ভুলগুলো নিখুঁতভাবে ফিক্স করা হচ্ছে
        node -e '
        const fs = require("fs");
        const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
        
        // ভুল এবং ফাঁকা ভার্সনগুলো লেটেস্ট দিয়ে রিপ্লেস করা হলো
        if(pkg.dependencies) {
          pkg.dependencies["nayan-apis-server"] = "latest";
          pkg.dependencies["string-similarity"] = "latest";
        }
        
        fs.writeFileSync("package.json", JSON.stringify(pkg, null, 4), "utf8");
        console.log("package.json successfully repaired!");
        '

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Start Messenger Bot
      run: npm run start
