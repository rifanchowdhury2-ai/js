name: Messenger Bot CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Fix and Install Dependencies
      run: |
        npm install string-similarity --legacy-peer-deps
        npm install nayan-apis-server@latest --legacy-peer-deps
        npm install --legacy-peer-deps

    - name: Start Messenger Bot
      run: npm run start
